name: Release
on:
  push:
    branches:
      - 'next'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    uses: ./.github/workflows/verify.yml

  publish:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every GitHub write goes through the release app token below; the job
    # token only reads the repository and mints the npm OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      # CI on a Version Packages PR opened with the job's GITHUB_TOKEN waits for
      # manual approval, which blocks the merge; the app's PRs run CI normally.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm exec changeset version
          commit-message: Version Packages
          pr-title: Version Packages
      - name: Validate GitHub release auth and notes
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm run release:github:preflight
      - name: Publish package to npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run release:publish
      - name: Push release tags
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          mapfile -t tags < <(git tag --points-at HEAD 'v*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No release tags found on HEAD."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            git push origin "$tag"
          done
      # changeset publish picks the npm dist-tag itself (see
      # docs/release-process.md), so only the GitHub Releases need syncing.
      - name: Create or update GitHub releases
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm run release:github-releases
