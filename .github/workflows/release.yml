name: Release
on:
  push:
    branches:
      - 'next'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    name: Verify Release (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify

  publish:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger CI for release branch
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: pnpm run release:branch-ci
      - name: Validate GitHub release auth and notes
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:github:preflight
      - name: Validate npm dist-tag auth
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release:dist-tags:preflight
      - name: Publish package to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release:publish
      - name: Push release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          mapfile -t tags < <(git tag --points-at HEAD 'v*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No release tags found on HEAD."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            git push origin "$tag"
          done
      - name: Reconcile release metadata
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:reconcile
