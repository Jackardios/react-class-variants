name: Release
on:
  push:
    branches:
      - 'next'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    name: Verify Release (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify

  publish:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger CI for release branch
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          gh workflow run main.yml --ref "$RELEASE_BRANCH"
          echo "Triggered CI workflow for $RELEASE_BRANCH."
      - name: Publish package to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release:publish
      - name: Push release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          mapfile -t tags < <(git tag --points-at HEAD 'v*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No release tags found on HEAD."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            git push origin "$tag"
          done
      - name: Sync npm dist-tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:dist-tags
      - name: Create or update GitHub releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t tags < <(git tag --points-at HEAD 'v*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No release tags found on HEAD."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            notes_file="$(mktemp)"
            pnpm run --silent release:notes -- "${tag#v}" > "$notes_file"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --title "$tag" \
                --notes-file "$notes_file"
              rm -f "$notes_file"
              continue
            fi
            if [[ "$tag" == *-* ]]; then
              gh release create "$tag" \
                --prerelease \
                --title "$tag" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" \
                --title "$tag" \
                --notes-file "$notes_file"
            fi
            rm -f "$notes_file"
          done
