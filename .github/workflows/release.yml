name: Release
on:
  push:
    branches:
      - 'next'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    uses: ./.github/workflows/verify.yml

  publish:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm exec changeset version
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger CI for release branch
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: pnpm run release:branch-ci
      - name: Validate GitHub release auth and notes
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:github:preflight
      - name: Check npm dist-tag repair availability
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          RELEASE_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:dist-tags:preflight
      - name: Publish package to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release:publish
      - name: Push release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          mapfile -t tags < <(git tag --points-at HEAD 'v*')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No release tags found on HEAD."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            git push origin "$tag"
          done
      - name: Sync npm dist-tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: sync_dist_tags
        continue-on-error: true
        env:
          RELEASE_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:dist-tags
      - name: Create or update GitHub releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: sync_github_releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:github-releases
      - name: Verify release reconciliation
        if: |
          steps.changesets.outputs.hasChangesets == 'false' &&
          (steps.sync_dist_tags.outcome == 'failure' || steps.sync_github_releases.outcome == 'failure')
        run: |
          echo "sync_dist_tags outcome: ${{ steps.sync_dist_tags.outcome }}"
          echo "sync_github_releases outcome: ${{ steps.sync_github_releases.outcome }}"
          exit 1
