name: CI
on:
  pull_request:
  push:
    # `next` is verified by the Release workflow and feature branches by their
    # PRs. Pushes run the workflow file of the pushed branch, so other branches
    # such as `v1-maintenance` keep their own triggers.
    branches:
      - 'main'
  # Manual runs for any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  overhead:
    name: Overhead
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check bundle overhead
        run: pnpm run check:overhead

  changeset:
    name: Changeset
    # Version Packages PRs consume changesets instead of adding them, and
    # Dependabot only bumps devDependencies and actions, which do not ship.
    # Only this repository's changeset-release/ branches are Version Packages
    # PRs; a fork can name its branch the same.
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'next' || github.base_ref == 'main') &&
      !(
        startsWith(github.head_ref, 'changeset-release/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches origin/<base>, which the script diffs against.
          fetch-depth: 0
          persist-credentials: false
      - name: Check changeset coverage
        run: node scripts/check-changeset.cjs

  # Branch protection requires a single `build` check; this job reports the
  # combined result of the other jobs under that name. `changeset` is skipped
  # outside pull requests to next and main.
  build:
    name: build
    if: always()
    needs: [verify, overhead, changeset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done
