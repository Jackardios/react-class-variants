name: CI
on:
  pull_request:
  push:
    # `next` is verified by the Release workflow and feature branches by their
    # PRs. Pushes run the workflow file of the pushed branch, so other branches
    # such as `v1-maintenance` keep their own triggers.
    branches:
      - 'main'
  # Used by scripts/trigger-release-branch-ci.mjs for changeset-release/* branches.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  overhead:
    name: Overhead
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check bundle overhead
        run: pnpm run check:overhead

  # Branch protection requires a single `build` check; this job reports the
  # combined result of the matrix and the overhead gate under that name.
  build:
    name: build
    if: always()
    needs: [verify, overhead]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
